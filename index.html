<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>6.04초를 잡아라</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 메인 화면 -->
    <div id="homeScreen" class="screen">

        <img src="assets/title.png" class="bg">

        <div class="menuArea">

            <button class="playBtn" onclick="openNameScreen()"></button>

            <button class="recordBtn" onclick="openRecordSearch()"></button>

            <button class="rankBtn" onclick="openRanking()"></button>

        </div>

    </div> <!-- homeScreen 닫기 -->

    <!-- 닉네임 입력 -->
    <div id="nameScreen" class="screen hidden">

        <img src="assets/name.png" class="bg">

        <input type="text" id="nicknameInput" maxlength="12" placeholder="닉네임 입력">

        <button id="startBtn" onclick="startGame()"></button>

    </div>

    <!-- 게임 -->
    <div id="gameScreen" class="screen hidden">

        <div id="timer">0.00</div>

        <button id="stopBtn" onclick="stopTimer()">
            STOP
        </button>

    </div>

    <!-- 결과 -->
    <div id="resultScreen" class="screen hidden">

        <img src="assets/doll.png" id="dollImage">

        <h1 id="resultTitle"></h1>

        <p id="resultTime"></p>

        <button onclick="restartGame()">
            다시하기
        </button>

        <button onclick="goHome()">
            처음으로
        </button>

    </div>

    <!-- 기록 -->
    <div id="recordScreen" class="screen hidden">

        <h1>개인 기록</h1>

        <input type="text" id="searchName" placeholder="닉네임">

        <button onclick="searchRecord()">
            조회
        </button>

        <div id="recordList"></div>

        <button onclick="goHome()">
            처음으로
        </button>

    </div>

    <!-- 랭킹 -->
    <div id="rankingScreen" class="screen hidden">

        <h1>TOP 10</h1>

        <div id="rankingList"></div>

        <button onclick="goHome()">
            처음으로
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
